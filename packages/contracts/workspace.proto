syntax = "proto3";

package workspace;

// Workspace filesystem access for the browser-facing file explorer.
// Served by the runtime (owner of the sandbox lifecycle); consumed by the
// gateway over gRPC. TypeScript mirrors live in:
//   - packages/runtime/src/workspace/types.ts (canonical)
//   - packages/studio/lib/api.ts + app/lib/workspace-files.ts (browser DTOs)
service WorkspaceService {
    rpc GetFileTree(WorkspaceTreeRequest) returns (WorkspaceTreeResponse);
    rpc ReadFile(WorkspaceFileRequest) returns (WorkspaceFileResponse);
}

message WorkspaceTreeRequest {
    string sessionId = 1;
    string userId = 2;
}

message WorkspaceNode {
    // Entry name (no path separators).
    string name = 1;
    // Path relative to the workspace root (no leading slash).
    string path = 2;
    // "file" | "dir"
    string kind = 3;
    int64 size = 4;
    // Child entries — populated on directories only.
    repeated WorkspaceNode children = 5;
}

message WorkspaceTreeResponse {
    // "ready" | "not_ready"
    string status = 1;
    string rootName = 2;
    repeated WorkspaceNode entries = 3;
    // True when the scan hit the entry/depth cap — the tree is partial.
    bool truncated = 4;
}

message WorkspaceFileRequest {
    string sessionId = 1;
    string userId = 2;
    // Path relative to the workspace root (no leading slash).
    string path = 3;
}

message WorkspaceFileResponse {
    string path = 1;
    string content = 2;
    int64 size = 3;
    // Content encoding — always "utf-8" for successfully read files.
    string encoding = 4;
}
